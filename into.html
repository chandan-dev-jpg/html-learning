<!DOCTYPE html>
<!-- 
HTML kya hai?
HTML (HyperText Markup Language) ek language hai jo web pages banane ke liye use hoti hai.
Isse hum website ka structure (heading, paragraph, image, link) banate hain.
-->

<html lang="en">
<!-- html tag pure webpage ko represent karta hai -->

<head>
    <!-- head me metadata hota hai (page ka info, title, links etc.) -->

    <meta charset="UTF-8">
    <!-- Ye character encoding set karta hai (UTF-8 = sab language support) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mobile responsive banane ke liye important hai -->

    <title>My First HTML Page</title>
    <!-- Browser tab me jo naam dikhta hai -->
</head>

<body>
    <!-- body me actual content hota hai jo user ko dikhta hai -->

</body>

</html>
