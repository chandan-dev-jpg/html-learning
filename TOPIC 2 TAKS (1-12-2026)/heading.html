<body>
    <!-- taks 2  -->
    <h1>Heading 1</h1> 
    <!-- h1 mean main heading -->
    <h2>Heading 2</h2>
    <!-- h2 mean second level heading -->
    <h3>Heading 3</h3>
    <!-- h3 mean sub-heading of h2  -->
    <h4>Heading 4</h4>
    <!-- h4 mean sub heading of h3 -->
    <h5>Heading 5</h5>
    <!-- h5 mean samller heading  -->
    <h6>Heading 6</h6>
    <!-- h6  mean smallest heading  -->
     <hr>
