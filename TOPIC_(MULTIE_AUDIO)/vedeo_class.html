    <!DOCTYPE html>

  <body>
    <!-- 
    ? how to add video in web page 
    * video tag , 

    ? where we pass the video address 
    * src attribute 


    ? what will the output after using video tag with src attribute that contains the value as a video address
    * thumbnail of the video 
    
    ? how to run or play or get the controls of the video 
    * by using the controls attribute 

    ? what are the features we will be get after using the controls attribute 
    - pause
    - play 
    - mute & unmute
    - full screen 
    - download 
    - play speed 
    - Pip

    ? can we change width & height ,if yes how ? 
    * by using width & height attribute 

    ? how to make the video auto play 
    * by using autoplay & muted attribute 

    ? how to keep the video autoplay in loop 
    * by using the loop attribute 

    ? where we need to write all these attribute 
    * inside the opening video tag just after the tag name , 

    
    
    -->
    <h2>normal video</h2>
    <video src="./video.mp4" controls width="30%"></video>
    <hr />

    <h2>auto play video</h2>
    <video src="./lanscape.mp4" autoplay muted loop width="100%"></video>
