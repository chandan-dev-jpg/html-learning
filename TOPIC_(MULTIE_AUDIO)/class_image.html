
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>normal image</h2>
    <img
      src="https://d1hbpr09pwz0sk.cloudfront.net/logo_url/img-62e16791"
      alt="description of the image "
      width=""
      height=""
      srcset="in this we pass the value in a way we can change the images based on the screen size automatically"
    />

    <h2>image as a link : open the url in same tab</h2>
    <a href="https://rocketreach.co/img-profile_b5c608a5f42e0c53">
      <img
        src="https://d1hbpr09pwz0sk.cloudfront.net/logo_url/img-62e16791"
        alt=""
      />
    </a>
    <h2>image as a link : open the url in new tab</h2>
    <a
      href="https://rocketreach.co/img-profile_b5c608a5f42e0c53"
      target="_blank"
    >
      <img
        src="https://d1hbpr09pwz0sk.cloudfront.net/logo_url/img-62e16791"
        alt=""
      />
    </a>

    <h2>click on the image and open the image in full screen</h2>
    <a href="./image.png">
      <img src="./image.png" alt="" />
    </a>
    <h2>
      click on the image and download - with same name whatever u have in ur
      system
    </h2>
    <a href="./image.png" download>
      <img src="./image.png" alt="" />
    </a>
    <h2>click on the image and download - with any name</h2>
    <a href="./image.png" download="pass_anyName_of_the_img">
      <img src="./image.png" alt="" />
    </a>
  </body>
</html>
